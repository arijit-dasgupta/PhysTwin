[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phystwin"
version = "0.1.0"
description = "Physics-informed reconstruction and simulation of deformable objects from videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PhysTwin authors" }]
dependencies = [
  "numpy>=1.26,<2.2",
  "torch>=2.4",
  "torchvision>=0.19",
  "warp-lang>=1.0",
  "tqdm>=4.65",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
  "wandb>=0.16",
  "open3d>=0.18",
  "scikit-learn>=1.3",
  "rerun-sdk>=0.20",
  "pyyaml>=6",
  "termcolor>=2.3",
  "cma>=3.3",
  "plyfile>=1.0",
  "kornia>=0.7",
  "gsplat>=1.4",
  "einops>=0.7",
  "trimesh>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
viz = ["rerun-sdk>=0.20"]
gradio = ["gradio>=4.0"]
bench-gpu = ["warp-lang>=1.0"]
# Kept for backwards compatibility; kornia+gsplat are now core deps (required by qqtt.engine at import).
gaussian = ["gsplat>=1.4", "kornia>=0.7"]

[project.urls]
Homepage = "https://github.com/.../PhysTwin"

[tool.hatch.build.targets.wheel]
packages = ["src/qqtt", "src/rerun_viz", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src/qqtt", "src/rerun_viz", "tests", "benchmarks", "scripts"]
exclude = [
  "gaussian_splatting",
  "data_process/TRELLIS",
  ".venv",
  "scripts/entrypoints",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["qqtt", "rerun_viz", "benchmarks", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts/shims"]
markers = [
  "gpu: tests that require a CUDA GPU (excluded from default CI)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
