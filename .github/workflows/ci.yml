name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Python
        run: uv python install 3.10

      - name: Sync (dev)
        run: uv sync --python 3.10 --extra dev

      - name: Ruff check
        run: uv run ruff check src tests benchmarks scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests benchmarks scripts

      - name: Pytest (CPU; exclude GPU-marked tests)
        run: uv run pytest -q -m "not gpu"
